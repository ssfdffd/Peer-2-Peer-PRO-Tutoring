# wrangler.toml
name = "damp-art-617fp2p-authentification-login"
main = "worker.js"
compatibility_date = "2024-04-01"

[assets]
directory = "./"
binding = "ASSETS"

# ✅ Auth Database (users, sessions)
[[d1_databases]]
binding = "AUTH_DB"              # ← This is what we'll use in code
database_name = "peer_db"
database_id = "f868485b-bba1-4158-b8f5-76b98fec8c79"

# ✅ Quiz Database (questions, attempts)
[[d1_databases]]
binding = "QUIZ_DB"
database_name = "quiz"
database_id = "968a34a2-480e-4e7d-87a5-20bd1bf400df"

# ✅ R2 Buckets
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "p2p-resources"

[[r2_buckets]]
binding = "AI_FILES"             # ← Optional: separate bucket for AI content
bucket_name = "ai-files"

[vars]
API_URL = "https://peer-2-peer.co.za"
# ⚠️ DO NOT put GEMINI_API_KEY here – use secrets (Step 3)