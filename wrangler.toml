name = "damp-art-617fp2p-authentification-login"
main = "quiz.js" # Matches your file name
compatibility_date = "2024-04-01"

# If your HTML files are in a folder named 'public':
# directory = "./public"
# If your HTML files are in the SAME folder as quiz.js:
directory = "./" 

binding = "ASSETS"

# Database 1 (Auth - if you still need it)
[[d1_databases]]
binding = "AUTH_DB"
database_name = "peer_db"
database_id = "f868485b-bba1-4158-b8f5-76b98fec8c79"

# Database 2 (Quiz - MUST match 'env.QUIZ_DB' in code)
[[d1_databases]]
binding = "QUIZ_DB"
database_name = "quiz"
database_id = "968a34a2-480e-4e7d-87a5-20bd1bf400df"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "ai-files"

[vars]
API_URL = "https://peer-2-peer.co.za"
# Do NOT put GEMINI_API_KEY here! Use 'wrangler secret put'