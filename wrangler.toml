name = "damp-art-617fp2p-authentification-login"
main = "quiz.js"
compatibility_date = "2024-04-01"

# All files (quiz.js, quiz.html, styles.css etc.) are in the SAME folder.
# The [assets] block tells Wrangler to serve everything in "./" as static files
# and binds them to env.ASSETS so the Worker can call env.ASSETS.fetch(request).
[assets]
directory = "./"
binding = "ASSETS"

# Database 1 — Auth (peer_db)
[[d1_databases]]
binding = "AUTH_DB"
database_name = "peer_db"
database_id = "f868485b-bba1-4158-b8f5-76b98fec8c79"

# Database 2 — Quiz (QUIZ_DB) — matches env.QUIZ_DB in quiz.js
[[d1_databases]]
binding = "QUIZ_DB"
database_name = "quiz"
database_id = "968a34a2-480e-4e7d-87a5-20bd1bf400df"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "ai-files"

[vars]
API_URL = "https://peer-2-peer.co.za"
# NEVER put GEMINI_API_KEY here — use: wrangler secret put GEMINI_API_KEY